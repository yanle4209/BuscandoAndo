# Solo para probar en la maquina de desarrollo.
#
# El docker-compose.yaml principal NO publica el puerto: en Coolify el
# trafico entra por Traefik y publicarlo chocaria con el proxy o con
# otro servicio. Para probar desde el navegador en local se anade este
# fichero, que abre el 8000 en loopback:
#
#   docker compose -f docker-compose.yaml -f deploy/docker-compose.local.yaml up -d --build
#
# Coolify NO usa este fichero (solo lee /docker-compose.yaml).

services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
