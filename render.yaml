# NOTA: este archivo no gobierna el servicio que ya existe. `buscandoando`
# se dio de alta desde el panel, no desde un Blueprint, así que su Build
# Command real vive en Settings -> Build Command y aquí abajo solo sirve
# como referencia (Render solo aplica render.yaml al crear el servicio).
# Si cambias buildCommand aquí, cámbialo también en el panel: por aquí no
# se redespliega nada.
services:
  - type: web
    name: buscandoando
    runtime: python
    # El ultimo paso es la carga de fichas nacionales: el archivo viaja en
    # el repo (backend/data/fichas_nacionales.ndjson.gz) y no puede ir al
    # Shell porque el plan gratis no lo tiene. Es idempotente — recarga la
    # propia base y da `creados 0, duplicados 16136` — asi que un deploy
    # mas no duplica nada y ademas repara la base si se recreara.
    # El `( ... || true)` protege SOLO ese paso: si falla el `migrate` o
    # el `load_initial_data`, la cadena `&&` se corta antes y el build
    # sigue fallando como debe.
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py setup_admin && python manage.py load_initial_data && (python manage.py cargar_fichas data/fichas_nacionales.ndjson.gz || true)
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_POSTGRES
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://buscandoando.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@buscandoando.com"
    # Health check: /api/health/ responde 200 sin tocar la base de datos
    # y expone RENDER_GIT_COMMIT, asi que un curl basta para saber que
    # commit esta en produccion (ver backend/config/health.py).
    healthCheckPath: /api/health/
    autoDeploy: true

databases:
  - name: buscandoando-db
    plan: free
    databaseName: buscandoando
