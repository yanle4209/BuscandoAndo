# NOTA: este archivo no gobierna el servicio que ya existe. `buscandoando`
# se dio de alta desde el panel, no desde un Blueprint, así que su Build
# Command real vive en Settings -> Build Command y aquí abajo solo sirve
# como referencia (Render solo aplica render.yaml al crear el servicio).
# Si cambias buildCommand aquí, cámbialo también en el panel: por aquí no
# se redespliega nada.
services:
  - type: web
    name: buscandoando
    runtime: python
    # La carga de fichas nacionales NO va en el build: corria en cada
    # deploy contra la base de datos EN VIVO (1.839 fichas, fila a fila)
    # mientras el sitio seguia sirviendo desde ella, y la maquina chica
    # de Render no aguantaba: durante la ventana del build, TODO lo que
    # consulta la BD devolvia 500 (sitemap, fichas, API) — incidente del
    # 20/oct 2026, ver DISENO.md 15.5.
    # Se corre a mano desde el Shell de Render, cuando haya un archivo
    # nuevo que importar o se recreue la base:
    #     cd backend && python manage.py cargar_fichas data/fichas_nacionales.ndjson.gz
    # Es idempotente y reanudable: repetirlo o cortarlo no duplica nada y
    # termina de cargar lo que falte. El archivo viaja en el repo
    # (backend/data/fichas_nacionales.ndjson.gz).
    # Los pasos que se quedan miden segundos: migrate (el esquema), el
    # admin inicial y los datos de arranque.
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py setup_admin && python manage.py load_initial_data
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_POSTGRES
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://buscandoando.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@buscandoando.com"
    # Health check: /api/health/ responde 200 sin tocar la base de datos
    # y expone RENDER_GIT_COMMIT, asi que un curl basta para saber que
    # commit esta en produccion (ver backend/config/health.py).
    healthCheckPath: /api/health/
    autoDeploy: true

databases:
  - name: buscandoando-db
    plan: free
    databaseName: buscandoando
