services:
  - type: web
    name: buscandoando
    runtime: python
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: buscandoando-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://buscandoando.onrender.com"
    healthCheckPath: /admin/
    autoDeploy: true

databases:
  - name: buscandoando-db
    plan: free
    databaseName: buscandoando
