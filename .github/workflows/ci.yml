# CI: los 260 tests de backend, los tests de Android y el lint/build del
# frontend en CADA push y PR.
#
# Contexto: hasta este workflow los 297 tests del proyecto no los ejecutaba
# nadie automáticamente (solo en local, a mano). El de keep-alive
# (despierto.yml) no cuenta: sólo hace curl.
#
# Notas de configuración:
# - Backend SIN variables de entorno: USE_POSTGRES apagado -> SQLite en
#   memoria, igual que en local.
# - Backend construye el FRONTEND ANTES de los tests, igual que Render
#   (render.yaml: buildCommand = npm install && npm run build && cd backend
#   && collectstatic...). Lo necesita seo/tests.py: serve_react devuelve
#   Http404 si no existe frontend/dist/index.html (views.py), que es
#   intencional (la auditoria C mato el "200 universal" que era un
#   soft-404), y 7 tests pintan la portada o el robots.txt del build.
# - collectstatic tambien va antes: genera staticfiles.json (en
#   .gitignore, ausente en un clon limpio) que exige STORAGES de
#   produccion; sin el, seo.tests.PanelSeoTest estalla con "Missing
#   staticfiles manifest entry".
# - Los pasos que pueden fallar vuelcan TODOS los fallos a anotaciones
#   (::error): en un repo publico las anotaciones se leen SIN iniciar
#   sesion, los logs no ("Sign in to view logs"). Ademas no se corta en
#   el primer test roto, que era como se ocultaron 7 fallos tras 1.
# - Android: sin acciones de terceros. El SDK ya viene en el runner
#   (acciones/runner-images), asi que no se instala nada: en el run #2
#   instalar "platforms;android-37" fallo porque esa cadena EXACTA no
#   existe (la del repositorio es android-37.0) y era ademas innecesaria.
# - ApiSmokeTest esta EXCLUIDO en CI (va contra el backend real): ver
#   android/app/build.gradle.kts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push rapido detras de otro no debe dejar tres CIs corriendo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Instalar dependencias de Node
        run: npm ci
        working-directory: frontend

      - name: Comprobacion estatica de Django
        run: python manage.py check
        working-directory: backend

      - name: Sin migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

      # Igual que en Render: el build del SPA es parte del build del
      # backend. Sin el, serve_react responde 404 y seo/tests.py miente.
      - name: Build del frontend (lo que sirve serve_react)
        run: npm run build
        working-directory: frontend

      - name: collectstatic (genera el manifest que exige STORAGES)
        run: python manage.py collectstatic --noinput
        working-directory: backend

      - name: Tests (SQLite)
        working-directory: backend
        # Se vuelca TODO el fallo (no solo el primer test roto, que era
        # como 7 fallos se escondian detras de 1) y se listan todos los
        # tests rotos en la anotacion.
        run: |
          if ! OUT=$(python manage.py test 2>&1); then
            echo "$OUT" | tail -60
            DETAIL=$(echo "$OUT" | grep -E '^(FAIL|ERROR):' | head -20 | tr '\n' ';')
            echo "::error::Tests de backend fallaron -> ${DETAIL:-ver salida del paso}"
            exit 1
          fi
          echo "$OUT" | tail -4

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de produccion
        run: npm run build

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El SDK preinstalado es de root: para que AGP pueda leerlo y
      # auto-descargar lo que falte, se pone en manos del usuario.
      # El SDK YA viene en el runner (acciones/runner-images: Android SDK
      # Platforms trae android-37.0/.1/.2, y ANDROID_HOME apunta a el).
      # No hay que instalar nada: en el run #2 instale
      # "platforms;android-37" (esa cadena EXACTA no existe: la del
      # repositorio es android-37.0) y sdkmanager se quejo justo ahi.
      # Lo que si hace falta es que el usuario pueda escribir en el SDK,
      # que en la imagen es de root.
      - name: Android SDK preinstalado, comprobado y en manos del usuario
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No hay Android SDK en $SDK. ANDROID_HOME=${ANDROID_HOME:-<vacia>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<vacia>}"
            exit 1
          fi
          sudo chown -R "$USER" "$SDK"
          echo "SDK en $SDK"
          PLATAFORMAS="$(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ' || true)"
          echo "Plataformas instaladas: ${PLATAFORMAS:-<ninguna>}"
          if ! ls "$SDK/platforms" 2>/dev/null | grep -q '^android-37'; then
            echo "::warning::No hay plataforma android-37* preinstalada: AGP la auto-descargara (el SDK ya es escribible)."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # CI=true (lo pone GitHub) excluye ApiSmokeTest: la suite aqui es
      # hermetica, sin red a produccion (ver app/build.gradle.kts).
      #
      # working-directory: android es OBLIGATORIO: gradlew vive en
      # android/, no en la raiz. Sin el, "./gradlew" daba "No such file
      # or directory" y el job nunca llego a gradle (seis rondas de rojo).
      - name: Tests unitarios
        working-directory: android
        # El guard distingue los dos casos que ya me han enganado: que
        # el fichero no exista en esta ruta (working-directory mal) y que
        # exista sin bit de ejecucion (git lo guarda como 100644 si el
        # repo se creo en Windows). Los dos dan exit 1 sin pasar por
        # gradle, y los dos se comia el grep de la anotacion.
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::No hay ./gradlew en $(pwd). Falta 'working-directory: android' en este paso."
            exit 1
          fi
          if [ ! -x ./gradlew ]; then
            echo "::error::$(pwd)/gradlew existe pero no es ejecutable (git: 100644, hace falta 100755). Arreglar: git update-index --chmod=+x android/gradlew"
            exit 1
          fi
          if ! OUT=$(./gradlew testDebugUnitTest --no-daemon 2>&1); then
            echo "$OUT" | tail -80
            echo "::error::Tests Android fallaron. Cola de la salida: $(echo "$OUT" | tail -15 | tr '\n' ' ' | cut -c1-1400)"
            exit 1
          fi
          echo "$OUT" | tail -4
